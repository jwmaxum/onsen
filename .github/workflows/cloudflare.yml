name: Deploy Onsen to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onsen-cloudflare-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build:cloudflare
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
      - run: npm run typecheck
      - name: Deploy production Worker
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ONSEN_POSTGREST_URL: ${{ vars.ONSEN_POSTGREST_URL }}
          ONSEN_SITE_URL: ${{ vars.ONSEN_SITE_URL }}
          ONSEN_CURSOR_SECRET: ${{ secrets.ONSEN_CURSOR_SECRET }}
          ONSEN_SUPABASE_PUBLIC_KEY: ${{ secrets.ONSEN_SUPABASE_PUBLIC_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          for (const name of ['CLOUDFLARE_ACCOUNT_ID', 'CLOUDFLARE_API_TOKEN', 'ONSEN_POSTGREST_URL', 'ONSEN_SITE_URL', 'ONSEN_CURSOR_SECRET', 'ONSEN_SUPABASE_PUBLIC_KEY']) {
            if (!process.env[name]) throw new Error(`${name} is required for deployment`);
          }
          const endpoint = new URL(process.env.ONSEN_POSTGREST_URL);
          if (endpoint.protocol !== 'https:' || !endpoint.hostname.endsWith('.supabase.co') || endpoint.pathname !== '/rest/v1' || endpoint.username || endpoint.password || endpoint.search || endpoint.hash) {
            throw new Error('ONSEN_POSTGREST_URL must be a hosted Supabase REST endpoint');
          }
          const origin = new URL(process.env.ONSEN_SITE_URL);
          if (origin.protocol !== 'https:' || origin.origin !== process.env.ONSEN_SITE_URL) {
            throw new Error('ONSEN_SITE_URL must be an HTTPS origin with no trailing slash');
          }
          const key = process.env.ONSEN_SUPABASE_PUBLIC_KEY;
          const getLegacyRole = (jwt) => {
            try { return JSON.parse(Buffer.from(jwt.split('.')[1], 'base64url').toString()).role; }
            catch { return undefined; }
          };
          if (!key.startsWith('sb_publishable_') && getLegacyRole(key) !== 'anon') {
            throw new Error('ONSEN_SUPABASE_PUBLIC_KEY must be a publishable or anon key');
          }
          if (process.env.ONSEN_CURSOR_SECRET.length < 32) {
            throw new Error('ONSEN_CURSOR_SECRET must contain at least 32 characters');
          }
          const probe = await fetch(new URL(`${endpoint.pathname}/web_catalog_versions?select=release_id&status=eq.active&limit=1`, endpoint), {
            headers: { apikey: key, 'Accept-Profile': 'api', ...(!key.startsWith('sb_publishable_') && { Authorization: `Bearer ${key}` }) },
            signal: AbortSignal.timeout(10000),
          });
          if (!probe.ok || !(await probe.json()).length) {
            throw new Error(`Supabase did not return a public catalog version (HTTP ${probe.status})`);
          }
          writeFileSync(join(process.env.RUNNER_TEMP, 'onsen-worker-secrets.json'), JSON.stringify({
            ONSEN_CURSOR_SECRET: process.env.ONSEN_CURSOR_SECRET,
            ONSEN_SUPABASE_PUBLIC_KEY: key,
          }), { mode: 0o600 });
          NODE
          trap 'rm -f -- "$RUNNER_TEMP/onsen-worker-secrets.json"' EXIT
          npx --no-install wrangler deploy \
            --var "ONSEN_POSTGREST_URL:$ONSEN_POSTGREST_URL" \
            --var "ONSEN_SITE_URL:$ONSEN_SITE_URL" \
            --secrets-file "$RUNNER_TEMP/onsen-worker-secrets.json"
      - name: Verify the deployed page and live catalog
        if: github.ref == 'refs/heads/main'
        env:
          ONSEN_SITE_URL: ${{ vars.ONSEN_SITE_URL }}
        run: |
          curl --fail --silent --show-error --retry 5 --max-time 20 --output /dev/null "$ONSEN_SITE_URL/ko/onsen"
          curl --fail --silent --show-error --retry 5 --max-time 20 "$ONSEN_SITE_URL/api/v1/onsen-entries?locale=ko&scope=nationwide&limit=2" |
            jq --exit-status '(.releaseId != null) and ((.items | length) > 0)' > /dev/null
